# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="YATNC"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_ZEPHYR_NUS=y

# MTU – allow large packets so whole messages fit in one notification
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# UART – interrupt-driven
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# USB CDC ACM console (board DTS routes console to USB)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Boot banner is printed before main() runs, i.e. before a terminal has had
# a chance to open the USB CDC ACM port - it gets dropped. Suppress it and
# print the version manually in main() after waiting for DTR instead.
CONFIG_BOOT_BANNER=n

# Logging
CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y

# Report stack overflows as an immediate fault instead of silent corruption
CONFIG_HW_STACK_PROTECTION=y

# Default (1024) isn't enough: uart_flush_work_handler -> process_uart_to_ble
# -> tnc_process_radio_bytes puts ~1.6KB of locals (payload[512], ax25_frame_t,
# kiss_buf[512], src/dest strings) on this thread's stack per UART frame,
# overflowing it hard enough to lock up the core before the fault handler can
# even print a dump (see tnc.c's raw-stream fallback path).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# GPIO
CONFIG_GPIO=y

# Persisted runtime config (callsign, beacon interval) - stored in the
# board's existing "storage" flash partition via the NVS settings backend.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Hardware PWM for TX Audio DAC (Pin 20 carrier, duty updated per AFSK sample)
CONFIG_PWM=y

# C++ Support for AFSK Modulator & Demodulator
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y

# ADC for RX Audio Pin 31 (AIN7)
CONFIG_ADC=y

# Output
CONFIG_BUILD_OUTPUT_UF2=y